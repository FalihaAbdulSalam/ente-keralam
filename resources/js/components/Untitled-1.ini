                                <script>
                                    $(document).ready(function() {
                                        const text = $('#pledgeText').text().trim();
                                        const words = text.split(/\s+/);
                                        $('#pledgeText').html(''); // Clear

                                        words.forEach((word, i) => {
                                            $('#pledgeText').append(`<span id="w${i}">${word}</span> `);
                                        });

                                        let i = 0;
                                        const interval = setInterval(() => {
                                            if (i > 0) {
                                                $(`#w${i - 1}`).removeClass('highlight');
                                            }
                                            if (i < words.length) {
                                                $(`#w${i}`).addClass('highlight');
                                                i++;
                                            } else {
                                                clearInterval(interval);
                                                $('#confirmDiv').fadeIn();
                                            }
                                        }, 500); // Adjust for flow speed
                                    });

                                    $('#confirmCheck').on('change', function() {
                                        if ($(this).is(':checked')) {
                                            $('#certModal').modal('show');
                                        }
                                    });

